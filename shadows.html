<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Среди теней — RoMaR MiRaGe</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="images/logo-frame.png"
    >
</head>


<body>

    <header class="site-header">

        <div class="logo">
            <img
                src="images/logo-frame.png"
                alt="RoMaR MiRaGe"
            >
        </div>


        <div class="account-area">

            <a
                href="/news"
                class="account-link news-link"
            >
                Новости
            </a>

            <a
                href="/login"
                class="account-link"
                id="login-link"
            >
                Войти
            </a>

            <a
                href="/register"
                class="account-link"
                id="account-link"
            >
                Регистрация
            </a>

            <button
                id="logout-button"
                type="button"
            >
                Выйти
            </button>

        </div>

    </header>


    <main class="scroll-page">


        <!-- ==============================
             ЗАГОЛОВОК СВИТКА
             ============================== -->

        <section class="scroll-header">

            <h1>Среди теней</h1>

            <p>
                Здесь будут собраны отдельные истории,
                скрывающиеся среди тайн, теней и забытых миров.
            </p>

        </section>


        <!-- ==============================
             АДМИНСКАЯ ФОРМА
             ============================== -->

        <section
            class="story-admin"
            id="story-admin"
        >

            <h2>Добавить историю</h2>


            <label for="story-scroll">
                Свиток
            </label>

            <select id="story-scroll">

                <option value="shadows">
                    Среди теней
                </option>

            </select>


            <label for="story-title">
                Название истории
            </label>

            <input
                type="text"
                id="story-title"
                maxlength="255"
                placeholder="Введите название"
            >


            <label for="story-images">
                Изображения истории
            </label>

            <input
                type="file"
                id="story-images"
                accept=".webp,image/webp"
                multiple
            >


            <div id="story-files"></div>


            <button
                id="upload-story"
                type="button"
            >
                Добавить историю
            </button>


            <p id="story-upload-message"></p>

        </section>


        <!-- ==============================
             СПИСОК ИСТОРИЙ
             ============================== -->

        <section
            class="stories-list"
            id="stories-list"
        >
        </section>


        <!-- ==============================
             НАЗАД
             ============================== -->

        <a
            href="/"
            class="home-button"
        >
            На главную
        </a>


    </main>


    <script src="js/script.js"></script>

</body>

</html>
