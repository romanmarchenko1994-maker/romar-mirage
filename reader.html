<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тени старого леса — RoMaR MiRaGe</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/logo-frame.png">
</head>

<body>

    <header class="site-header">

        <div class="logo">
            <img src="images/logo-frame.png" alt="RoMaR MiRaGe">
        </div>

        <div class="account-area">
            <a href="/news" class="account-link news-link">Новости</a>
            <a href="/login" class="account-link" id="login-link">Войти</a>
            <a href="/register" class="account-link" id="account-link">Регистрация</a>
            <button id="logout-button" type="button">Выйти</button>
        </div>

    </header>


    <main class="reader-page">

        <h1 class="reader-title">Тени старого леса</h1>

        <div class="reader">

            <button
                class="reader-button reader-prev"
                id="reader-prev"
                type="button"
                aria-label="Предыдущая страница"
            >
                ←
            </button>

            <div class="reader-image-container">
                <img
                    id="reader-image"
                    src="images/test-story/01.webp"
                    alt="Страница истории"
                >
            </div>

            <button
                class="reader-button reader-next"
                id="reader-next"
                type="button"
                aria-label="Следующая страница"
            >
                →
            </button>

        </div>

        <div class="reader-counter" id="reader-counter">
            1 / 3
        </div>

        <a href="/shadows" class="home-button reader-back">
            ← К свитку
        </a>

    </main>


    <script src="js/script.js"></script>
    <script src="js/reader.js"></script>

</body>
</html>
